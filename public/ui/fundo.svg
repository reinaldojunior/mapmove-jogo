<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f7fe8"/><stop offset="0.45" stop-color="#5fb4ff"/><stop offset="0.62" stop-color="#bfe4ff"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.82" cy="0.12" r="0.35">
      <stop offset="0" stop-color="#fff8d6" stop-opacity="0.95"/><stop offset="0.25" stop-color="#fff1a8" stop-opacity="0.45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="asfalto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f7685"/><stop offset="1" stop-color="#3b4150"/>
    </linearGradient>
    <linearGradient id="grama" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc24a"/><stop offset="1" stop-color="#2f8a2c"/>
    </linearGradient>
    <linearGradient id="predio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc9f0"/><stop offset="1" stop-color="#cfe6fa"/>
    </linearGradient>
    <linearGradient id="predio2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb2e0"/><stop offset="1" stop-color="#b6d6f3"/>
    </linearGradient>
    <g id="nuvem"><ellipse cx="0" cy="0" rx="34" ry="14"/><circle cx="-14" cy="-8" r="13"/><circle cx="6" cy="-13" r="16"/><circle cx="22" cy="-5" r="11"/></g>
